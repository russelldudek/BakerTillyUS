name: Bootstrap complete Baker Tilly campaign

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baker-tilly-campaign-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct campaign source
        shell: bash
        run: |
          cat bootstrap/chunk-*.b64 | base64 --decode > /tmp/BakerTillyUS-source.zip
          unzip -o /tmp/BakerTillyUS-source.zip -d .
          test -f index.html
          test -f scripts/generate-pdfs.mjs
          test -f assets/brand/baker-tilly-logo.svg

      - name: Install PDF tooling
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate PDFs
        run: node scripts/generate-pdfs.mjs

      - name: Verify release contracts
        shell: bash
        run: |
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Resume.pdf | awk '/^Pages:/{print $2}')" = "2"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Cover-Letter.pdf | awk '/^Pages:/{print $2}')" = "1"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Interview-Thesis-Brief.pdf | awk '/^Pages:/{print $2}')" = "3"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-120-Day-Plan.pdf | awk '/^Pages:/{print $2}')" = "3"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Value-Conversion-Review.pdf | awk '/^Pages:/{print $2}')" = "2"
          for pdf in docs/*.pdf; do
            pdftotext "$pdf" - | grep -q 'BakerTillyUS'
          done
          grep -q 'Value Conversion Equation' index.html
          grep -q 'prefers-reduced-motion' styles.css
          grep -q 'baker-tilly-logo.svg' index.html

      - name: Commit complete campaign to main
        shell: bash
        run: |
          rm -rf bootstrap node_modules
          rm -f package.json package-lock.json
          rm -f .github/workflows/bootstrap-campaign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Baker Tilly candidate campaign"
          git push origin main
