name: Generate candidate PDFs and verify mobile documents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - 'assets/brand/**'
      - 'scripts/generate-pdfs.mjs'
      - '.github/workflows/generate-pdfs.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser and PDF tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Generate PDFs
        run: node scripts/generate-pdfs.mjs
      - name: Verify PDF contracts
        run: |
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Resume.pdf | awk '/^Pages:/{print $2}')" = "2"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Cover-Letter.pdf | awk '/^Pages:/{print $2}')" = "1"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-120-Day-Plan.pdf | awk '/^Pages:/{print $2}')" = "2"
          test "$(pdfinfo docs/Russell-Dudek-Baker-Tilly-Value-Conversion-Review.pdf | awk '/^Pages:/{print $2}')" = "2"
          test -z "$(find . -maxdepth 2 -type f -iname '*interview*' -print -quit)"
          for pdf in docs/*.pdf; do pdftotext "$pdf" - | grep -q 'BakerTillyUS'; done
      - name: Verify mobile document geometry
        shell: bash
        run: |
          mkdir -p qa/mobile-correction
          python3 -m http.server 4173 >/tmp/baker-tilly-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat >mobile-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const sources = ['resume.html','cover-letter.html','120-day-plan.html','value-conversion-review.html'];
          const widths = [390,320];
          const results = [];
          for (const source of sources) {
            for (const width of widths) {
              const page = await browser.newPage({ viewport: { width, height: 844 }, deviceScaleFactor: 1 });
              await page.goto(`http://127.0.0.1:4173/${source}`, { waitUntil: 'networkidle' });
              const geometry = await page.evaluate(() => {
                const overflow = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth;
                const offenders = [...document.querySelectorAll('body *')]
                  .filter(el => !el.closest('.document-nav'))
                  .map(el => ({ el, rect: el.getBoundingClientRect() }))
                  .filter(({ rect }) => rect.width > 0 && (rect.left < -1 || rect.right > innerWidth + 1))
                  .slice(0, 12)
                  .map(({ el, rect }) => ({ tag: el.tagName, className: String(el.className || ''), left: Math.round(rect.left), right: Math.round(rect.right), viewport: innerWidth }));
                return { overflow: Math.round(overflow), offenders };
              });
              await page.screenshot({ path: `qa/mobile-correction/${source.replace('.html','')}-${width}.png`, fullPage: true });
              results.push({ source, width, ...geometry });
              if (geometry.overflow > 1 || geometry.offenders.length) throw new Error(`${source} ${width}px: ${JSON.stringify(geometry)}`);
              await page.close();
            }
          }
          await browser.close();
          await writeFile('qa/mobile-correction/results.json', JSON.stringify(results, null, 2));
          EOF
          node ./mobile-qa.mjs
          rm -f mobile-qa.mjs
      - name: Verify candidate-positioning regression rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          banned = [
              "prior Baker Tilly experience",
              "not a claim",
              "Interview " + "thesis",
              "Interview " + "Brief",
              "Listen at " + "the work",
          ]
          offenders = []
          for pattern in ("*.html", "*.md"):
              for path in Path(".").rglob(pattern):
                  text = path.read_text(encoding="utf-8", errors="ignore").lower()
                  for phrase in banned:
                      if phrase.lower() in text:
                          offenders.append(f"{path}: {phrase}")
          if offenders:
              raise SystemExit("Rejected candidate-facing language remains:\n" + "\n".join(offenders))
          PY
      - name: Write correction receipt
        run: |
          cat > qa/mobile-correction/README.md <<'EOF'
          # Mobile document and candidate-positioning correction

          Verified at 390px and 320px for the resume, cover letter, 120-day plan, and Value Conversion Review.

          Corrections applied:
          - fixed narrow-screen overflow and fixed-sheet clipping;
          - reflowed columns, tables, forms, navigation, headers, and long contact strings;
          - replaced defensive target-company experience language with confident transferability;
          - replaced the awkward entry-plan phrasing with direct operational language;
          - rebuilt the 120-day plan as two deliberately filled pages;
          - removed the retired public brief and every link to it.

          PDF contracts: resume 2 pages, cover letter 1 page, 120-day plan 2 pages, Value Conversion Review 2 pages.
          EOF
      - name: Commit generated PDFs and QA evidence
        run: |
          rm -f mobile-qa.mjs
          rm -rf node_modules package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf qa/mobile-correction
          if git diff --cached --quiet; then
            echo "Generated artifacts already current"
          else
            git commit -m "Verify corrected mobile documents and regenerate PDFs"
            git push origin main
          fi
